[project]
name = "weather-forecast"
version = "0.8.0"
requires-python = ">=3.14"
description = "A local-first PoC: JMA weather charts → LLaVA → Salesforce"
# tested on 2026-07-08
dependencies = [
    "accelerate==1.11.0",
    "attrs==25.4.0",
    "certifi==2025.11.12",
    "cffi==2.0.0",
    "charset-normalizer==3.4.4",
    "cryptography==46.0.3",
    "filelock==3.20.0",
    "fsspec==2025.10.0",
    "hf-xet==1.2.0",
    "huggingface-hub==0.36.0",
    "idna==3.11",
    "iniconfig==2.3.0",
    "isodate==0.7.2",
    "Jinja2==3.1.6",
    "lxml==6.0.2",
    "MarkupSafe==3.0.3",
    "more-itertools==10.8.0",
    "mpmath==1.3.0",
    "networkx==3.5",
    "numpy==2.3.5",
    "packaging==25.0",
    "pdf2image==1.17.0",
    "pillow==12.0.0",
    "platformdirs==4.5.0",
    "pluggy==1.6.0",
    "psutil==7.1.3",
    "pycparser==2.23",
    "Pygments==2.19.2",
    "PyJWT==2.10.1",
    "pytest==9.0.1",
    "pytest-mock==3.15.1",
    "python-dotenv==1.2.1",
    "pytz==2025.2",
    "PyYAML==6.0.3",
    "regex==2025.11.3",
    "requests==2.32.5",
    "requests-file==3.0.1",
    "requests-toolbelt==1.0.0",
    "safetensors==0.6.2",
    "setuptools==80.9.0",
    "simple-salesforce==1.12.9",
    "sympy==1.14.0",
    "tokenizers==0.22.1",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision==0.24.1",
    "tqdm==4.67.1",
    "transformers==4.57.1",
    "typing_extensions==4.15.0",
    "urllib3==2.5.0",
    "zeep==4.3.2",
]

[project.scripts]
weather-forecast = "weather_forecast.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]        # points at the src/ layout so tests import the real package
testpaths = ["tests"]       # tells pytest where to look for tests
python_files = "test_*.py"  # which files are test files
python_functions = "test_*" # which functions are test functions
addopts = "-ra -q"          # default flags: show extra summary, quiet output
